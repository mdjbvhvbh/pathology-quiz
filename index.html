<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>General Pathology Exam</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    padding: 10px;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: #f1f5f9;
    color: #0f172a;

    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -webkit-touch-callout: none;
}

/* =========================
   CONTAINER
========================= */

.container {
    width: 100%;
    max-width: 760px;
    margin: 10px auto;
    background: #fff;
    border-radius: 18px;
    padding: 20px;

    box-shadow:
        0 8px 30px rgba(15, 23, 42, 0.08);
}

/* =========================
   HEADER
========================= */

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    margin: 0;
    color: #1e3a8a;
    font-size: 24px;
}

.header p {
    margin: 8px 0 0;
    color: #64748b;
    font-size: 14px;
}

/* =========================
   START SCREEN
========================= */

#startScreen {
    display: block;
}

.input-group {
    margin: 25px 0;
}

.input-group label {
    display: block;
    font-weight: 700;
    margin-bottom: 8px;
    color: #334155;
}

.input-group input {
    width: 100%;
    padding: 14px;

    border: 1.5px solid #cbd5e1;
    border-radius: 10px;

    font-size: 16px;
    outline: none;

    user-select: text;
    -webkit-user-select: text;
}

.input-group input:focus {
    border-color: #2563eb;
}

/* =========================
   EXAM INFO
========================= */

.exam-info {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
}

.info-box {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 13px 8px;
    text-align: center;
}

.info-box strong {
    display: block;
    font-size: 18px;
    color: #1e3a8a;
}

.info-box span {
    font-size: 12px;
    color: #64748b;
}

/* =========================
   BUTTONS
========================= */

.primary-btn,
.secondary-btn,
.translation-btn {
    width: 100%;
    border: none;
    border-radius: 11px;
    padding: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

.primary-btn {
    background: #2563eb;
    color: #fff;
}

.primary-btn:active,
.secondary-btn:active,
.translation-btn:active {
    transform: scale(0.98);
}

.secondary-btn {
    background: #e2e8f0;
    color: #0f172a;
    margin-top: 10px;
}

.translation-btn {
    background: #eff6ff;
    color: #1d4ed8;
    border: 1px solid #bfdbfe;
    margin-top: 10px;
    font-size: 14px;
}

/* =========================
   EXAM SCREEN
========================= */

#examScreen {
    display: none;
}

.exam-top {
    position: sticky;
    top: 0;
    z-index: 20;
    background: #fff;
    padding-bottom: 15px;
}

.top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
}

.progress-text {
    font-weight: 700;
    color: #334155;
    font-size: 14px;
}

.timer {
    background: #eff6ff;
    color: #1d4ed8;
    border-radius: 10px;
    padding: 9px 14px;
    font-weight: 900;
    direction: ltr;
    min-width: 75px;
    text-align: center;
    font-size: 18px;
}

.timer.warning {
    background: #fef3c7;
    color: #b45309;
}

.timer.danger {
    background: #fee2e2;
    color: #b91c1c;

    animation:
        timerPulse 0.8s infinite alternate;
}

@keyframes timerPulse {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.05);
    }
}

/* =========================
   PROGRESS BAR
========================= */

.progress-container {
    width: 100%;
    height: 9px;
    background: #e2e8f0;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #2563eb;
    transition: width 0.3s ease;
}

/* =========================
   QUESTION
========================= */

.question-card {
    margin-top: 20px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 15px;
    padding: 20px;
}

.question-number {
    color: #2563eb;
    font-weight: 800;
    font-size: 14px;
    margin-bottom: 12px;
}

.question-text {
    direction: ltr;
    text-align: left;

    font-size: 18px;
    font-weight: 700;
    line-height: 1.6;

    color: #0f172a;
    margin-bottom: 12px;

    user-select: none;
    -webkit-user-select: none;
}

/* =========================
   TRANSLATION
========================= */

.translation-box {
    display: none;

    direction: rtl;
    text-align: right;

    background: #ecfeff;
    border: 1px solid #a5f3fc;

    color: #164e63;

    border-radius: 10px;
    padding: 12px;
    margin: 10px 0 18px;

    font-size: 14px;
    line-height: 1.7;
}

/* =========================
   OPTIONS
========================= */

.options {
    direction: ltr;
}

.option {
    display: flex;
    align-items: center;
    gap: 10px;

    width: 100%;

    background: #fff;

    border: 1.5px solid #cbd5e1;
    border-radius: 11px;

    padding: 14px;
    margin-bottom: 11px;

    cursor: pointer;

    text-align: left;

    font-size: 15px;
    line-height: 1.5;

    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;

    transition: 0.15s ease;
}

.option:active {
    transform: scale(0.99);
}

.option.selected {
    border-color: #2563eb;
    background: #dbeafe;
}

.option.correct {
    border-color: #16a34a;
    background: #dcfce7;
}

.option.wrong {
    border-color: #dc2626;
    background: #fee2e2;
}

.option-letter {
    flex-shrink: 0;

    width: 32px;
    height: 32px;

    border-radius: 50%;

    background: #e2e8f0;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: 800;
    color: #334155;
}

.option.selected .option-letter {
    background: #2563eb;
    color: #fff;
}

.option.correct .option-letter {
    background: #16a34a;
    color: #fff;
}

.option.wrong .option-letter {
    background: #dc2626;
    color: #fff;
}

/* =========================
   STATUS
========================= */

.question-status {
    text-align: center;
    color: #64748b;
    font-size: 13px;
    margin-top: 14px;
    min-height: 20px;
}

.timeout-message,
.correct-message,
.wrong-message {
    border-radius: 10px;
    padding: 10px;
    margin-top: 10px;
    font-weight: 700;
    line-height: 1.6;
}

.timeout-message {
    background: #fef3c7;
    color: #92400e;
}

.correct-message {
    background: #dcfce7;
    color: #166534;
}

.wrong-message {
    background: #fee2e2;
    color: #991b1b;
}

/* =========================
   RESULT
========================= */

#resultScreen {
    display: none;
    text-align: center;
}

.result-icon {
    font-size: 55px;
    margin-bottom: 10px;
}

.result-title {
    color: #065f46;
    font-size: 24px;
    font-weight: 800;
}

.score-circle {
    width: 150px;
    height: 150px;

    border-radius: 50%;

    margin: 25px auto;

    background: #ecfdf5;
    border: 8px solid #10b981;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.score-number {
    font-size: 30px;
    font-weight: 900;
    color: #065f46;
}

.score-percent {
    font-size: 14px;
    color: #047857;
}

.result-evaluation {
    font-size: 18px;
    font-weight: 800;
    margin: 15px 0;
}

.result-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 20px 0;
}

.result-item {
    padding: 15px 8px;
    border-radius: 12px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
}

.result-item strong {
    display: block;
    font-size: 21px;
}

.result-item span {
    font-size: 12px;
    color: #64748b;
}

.duration-box {
    background: #eff6ff;
    border: 1px solid #bfdbfe;

    color: #1e3a8a;

    border-radius: 12px;

    padding: 13px;
    margin: 15px 0;

    font-weight: 700;
}

.focus-box {
    background: #fff7ed;
    border: 1px solid #fed7aa;

    color: #9a3412;

    border-radius: 12px;

    padding: 13px;
    margin: 15px 0;

    font-size: 14px;
}

/* =========================
   PRIVACY MASK
========================= */

#privacyMask {
    display: none;

    position: fixed;
    inset: 0;

    z-index: 9999;

    background: #0f172a;
    color: #fff;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 30px;

    font-size: 18px;
    font-weight: 700;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    body {
        padding: 7px;
    }

    .container {
        margin: 4px auto;
        padding: 15px;
        border-radius: 14px;
    }

    .header h1 {
        font-size: 20px;
    }

    .header p {
        font-size: 13px;
    }

    .question-card {
        padding: 15px;
    }

    .question-text {
        font-size: 16px;
    }

    .option {
        font-size: 14px;
        padding: 12px;
    }

    .timer {
        font-size: 16px;
        min-width: 65px;
        padding: 8px 10px;
    }
}
</style>
</head>

/* =========================================================
   BACKEND
========================================================= */

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbzUQLJN40vyblri1MGbY6ZjvsOYUhGeC12HHl64X2sS8piWUmjx8fq1eH9tYgmUIg_Shw/exec";


/* =========================================================
   EXAM SETTINGS
========================================================= */

/*
   الوقت الثابت لكل سؤال:
   15 ثانية
*/

const QUESTION_TIME = 15;


/* =========================================================
   VARIABLES
========================================================= */

let questionTimer = null;

let questionTimeLeft = QUESTION_TIME;

let currentQuestion = 0;

let examQuestions = [];

let userAnswers = {};

let timeoutQuestions = {};

let studentName = "";

let examFinished = false;

let examStartTime = null;

let examEndTime = null;

let focusLosses = 0;

let questionLocked = false;


/* =========================================================
   QUESTIONS
   عدد الأسئلة = 43
   المحذوفة:
   33
   34
   46
   47
   48
   49
   50
========================================================= */

const quizData = [

{
    q: "The fundamental difference between simple atrophy and numerical atrophy is:",
    translation: "ما الفرق الأساسي بين الضمور البسيط والضمور العددي؟",
    options: [
        "Physiologic etiology vs pathologic etiology",
        "Loss of cell size only vs loss of cell size and number via apoptosis",
        "Reversible vs irreversible injury",
        "Cytoplasmic swelling vs fragmentation"
    ],
    answer: 1
},

{
    q: "Which cellular adaptation is characterized by an increase in the size of parenchymal cells resulting in organ enlargement?",

    options: [
        "Hyperplasia",
        "Metaplasia",
        "Hypertrophy",
        "Atrophy"

},

{
    q: "Left ventricular hypertrophy in systemic hypertension is classified as:",

    options: [
        "Compensatory hypertrophy due to increased workload",
        "Physiologic hyperplasia",
        "Pathologic metaplasia",
        "Disuse atrophy"
    ],
    answer: 0
},

{
    q: "Hyperplasia can occur alongside hypertrophy in various tissues EXCEPT in:",
    translation: "يمكن أن يحدث فرط التنسج بالتزامن مع التضخم في أنسجة مختلفة ما عدا:",
    options: [
        "Uterine smooth muscle",
        "Breast glandular tissue",
        "Liver parenchyma",
        "Cardiac and skeletal muscles"
    ],
    answer: 3
},

{
    q: "Cigarette smoking classically induces which adaptive epithelial change in the bronchi?",

    options: [
        "Glandular hyperplasia",
        "Squamous metaplasia",
        "Simple atrophy",
        "Dysplastic hypertrophy"
    ],
    answer: 1
},

{
    q: "The hallmark reversible changes visible on light microscopy following cellular injury are:",
    translation: "ما التغيرات العكوسة المميزة التي يمكن رؤيتها بالمجهر الضوئي بعد إصابة الخلية؟",
    options: [
        "Pyknosis and karyolysis",
        "Caseous necrosis and calcification",

{

{

    answer: 0

{

{

{

    options: [

        "Fibrinogen",
        "Transferrin",
        "Superoxide dismutase"
    ],
    answer: 1
},

{
    q: "Cells that continuously divide throughout life to replace lost cells (e.g., surface epithelia) are classified as:",
    translation: "الخلايا التي تنقسم باستمرار طوال الحياة لتعويض الخلايا المفقودة، مثل الظهارات السطحية، تُصنف على أنها:",
    options: [

        "Stable cells",
        "Permanent cells",
        "Quiescent cells"
    ],
    answer: 0
},

{
    q: "Cardiac myocytes and neurons are incapable of postnatal division and are classified as:",

    options: [
        "Stable cells",
        "Labile cells",
        "Permanent cells",
        "Stem cells"
    ],
    answer: 2
},

{
    q: "Histologically, granulation tissue is composed of:",

/* =========================================================
   SHUFFLE QUESTIONS + OPTIONS
========================================================= */

function shuffleQuestions() {

    const copied =
        quizData.map(item => {

            const optionsWithAnswers =
                item.options.map(
                    (text, index) => ({
                        text: text,
                        originalIndex: index
                    })
                );

            const shuffledOptions =
                shuffleArray(
                    optionsWithAnswers
                );

            return {

                q: item.q,

                translation:
                    item.translation,

                options:
                    shuffledOptions.map(
                        option =>
                            option.text
                    ),

                answer:
                    shuffledOptions.findIndex(
                        option =>
                            option.originalIndex ===
                            item.answer
                    )
            };
        });

    return shuffleArray(copied);
}


function shuffleArray(array) {

    const arr = [...array];

    for (
        let i = arr.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            arr[i],
            arr[j]
        ] =
        [
            arr[j],
            arr[i]
        ];
    }

    return arr;
}


/* =========================================================
   RENDER QUESTION
========================================================= */

function renderQuestion() {

    clearQuestionTimer();

    questionLocked = false;

    const question =
        examQuestions[currentQuestion];

    if (!question) {
        return;
    }

    const total =
        examQuestions.length;


    document.getElementById(
        "questionNumber"
    ).innerText =
        `السؤال ${currentQuestion + 1}`;


    document.getElementById(
        "progressText"
    ).innerText =
        `السؤال ${currentQuestion + 1} من ${total}`;


    document.getElementById(
        "questionText"
    ).innerText =
        question.q;


    const translationBox =
        document.getElementById(
            "translationBox"
        );

    translationBox.innerText =
        question.translation;

    translationBox.style.display =
        "none";


    document.getElementById(
        "translationBtn"
    ).innerText =
        "🌐 ترجمة السؤال";


    const progress =
        (
            (currentQuestion + 1) /
            total
        ) * 100;


    document.getElementById(
        "progressBar"
    ).style.width =
        progress + "%";


    const optionsContainer =
        document.getElementById(
            "optionsContainer"
        );

    optionsContainer.innerHTML =
        "";


    const letters =
        ["A", "B", "C", "D"];


    question.options.forEach(
        (option, index) => {

            const button =
                document.createElement("div");

            button.className =
                "option";

            button.innerHTML = `
                <span class="option-letter">
                    ${letters[index]}
                </span>

                <span>
                    ${escapeHTML(option)}
                </span>
            `;

            button.addEventListener(
                "click",
                () => selectAnswer(index)
            );

            optionsContainer.appendChild(
                button
            );
        }
    );


    document.getElementById(
        "questionStatus"
    ).innerText =
        "⏱️ لديك 15 ثانية للإجابة";


    startQuestionTimer();
}

/* =========================================================
   SELECT ANSWER
========================================================= */

function selectAnswer(index) {

    if (
        examFinished ||
        questionLocked
    ) {
        return;
    }

    questionLocked = true;

    clearQuestionTimer();


    userAnswers[currentQuestion] =
        index;


    const question =
        examQuestions[currentQuestion];


    const options =
        document.querySelectorAll(
            ".option"
        );


    options.forEach(
        (option, optionIndex) => {

            option.style.pointerEvents =
                "none";

            if (
                optionIndex ===
                question.answer
            ) {

                option.classList.add(
                    "correct"
                );
            }

            if (
                optionIndex === index &&
                index !== question.answer
            ) {

                option.classList.add(
                    "wrong"
                );
            }
        }
    );


    if (
        index === question.answer
    ) {

        document.getElementById(
            "questionStatus"
        ).innerHTML = `
            <div class="correct-message">
                ✅ إجابة صحيحة
            </div>
        `;

    } else {

        document.getElementById(
            "questionStatus"
        ).innerHTML = `
            <div class="wrong-message">
                ❌ إجابة خاطئة
                <br>
                ✓ الإجابة الصحيحة:
                ${escapeHTML(
                    question.options[
                        question.answer
                    ]
                )}
            </div>
        `;
    }


    saveProgress();


    setTimeout(
        () => {
            goToNextQuestion();
        },
        700
    );
}


/* =========================================================
   NEXT QUESTION
========================================================= */

function goToNextQuestion() {

    if (
        currentQuestion <
        examQuestions.length - 1
    ) {

        currentQuestion++;

        renderQuestion();

        saveProgress();

    } else {

        finishExam();
    }
}


/* =========================================================
   15-SECOND TIMER
========================================================= */

function startQuestionTimer() {

    clearQuestionTimer();

    questionTimeLeft =
        QUESTION_TIME;

    updateQuestionTimer();


    questionTimer =
        setInterval(
            () => {

                questionTimeLeft--;

                updateQuestionTimer();


                if (
                    questionTimeLeft <= 0
                ) {

                    clearQuestionTimer();

                    handleTimeout();
                }

            },
            1000
        );
}


/* =========================================================
   UPDATE TIMER
========================================================= */

function updateQuestionTimer() {

    const timer =
        document.getElementById(
            "timer"
        );


    timer.innerText =
        String(
            Math.max(
                0,
                questionTimeLeft
            )
        ).padStart(
            2,
            "0"
        );


    timer.classList.remove(
        "warning",
        "danger"
    );


    /*
       تنبيه عند 5 ثوانٍ أو أقل
    */

    if (
        questionTimeLeft <= 3
    ) {

        timer.classList.add(
            "danger"
        );

    } else if (
        questionTimeLeft <= 5
    ) {

        timer.classList.add(
            "warning"
        );
    }
}


/* =========================================================
   CLEAR TIMER
========================================================= */

function clearQuestionTimer() {

    if (questionTimer !== null) {

        clearInterval(
            questionTimer
        );

        questionTimer = null;
    }
}


/* =========================================================
   TIMEOUT
========================================================= */

function handleTimeout() {

    if (
        questionLocked ||
        examFinished
    ) {
        return;
    }


    questionLocked = true;


    const question =
        examQuestions[currentQuestion];


    timeoutQuestions[currentQuestion] =
        true;


    userAnswers[currentQuestion] =
        null;


    const options =
        document.querySelectorAll(
            ".option"
        );


    options.forEach(
        (option, index) => {

            option.style.pointerEvents =
                "none";


            if (
                index === question.answer
            ) {

                option.classList.add(
                    "correct"
                );
            }
        }
    );


    document.getElementById(
        "questionStatus"
    ).innerHTML = `
        <div class="timeout-message">
            ⏰ انتهى الوقت — تُحسب الإجابة خطأ
            <br>
            ✓ الإجابة الصحيحة:
            ${escapeHTML(
                question.options[
                    question.answer
                ]
            )}
        </div>
    `;


    saveProgress();


    /*
       عرض الإجابة الصحيحة لمدة قصيرة
       ثم الانتقال تلقائيًا
    */

    setTimeout(
        () => {
            goToNextQuestion();
        },
        1200
    );
}


/* =========================================================
   FINISH EXAM
========================================================= */

async function finishExam() {

    if (examFinished) {
        return;
    }


    examFinished = true;

    clearQuestionTimer();


    examEndTime =
        Date.now();


    const total =
        examQuestions.length;


    let score = 0;

    let timeoutCount = 0;

    let wrong = 0;

    let unanswered = 0;


    examQuestions.forEach(
        (question, index) => {

            const selected =
                userAnswers[index];


            if (
                timeoutQuestions[index]
            ) {

                timeoutCount++;

                wrong++;

                return;
            }


            if (
                selected !== undefined &&
                selected !== null
            ) {

                if (
                    selected ===
                    question.answer
                ) {

                    score++;

                } else {

                    wrong++;
                }

            } else {

                unanswered++;

                wrong++;
            }
        }
    );


    const percent =
        Math.round(
            (score / total) * 100
        );


    const durationSeconds =
        Math.max(
            0,
            Math.round(
                (
                    examEndTime -
                    examStartTime
                ) / 1000
            )
        );


    const durationText =
        formatDuration(
            durationSeconds
        );


    const evaluation =
        getEvaluation(
            percent
        );


    localStorage.removeItem(
        "pathologyQuizProgress"
    );


    document.getElementById(
        "examScreen"
    ).style.display =
        "none";


    document.getElementById(
        "resultScreen"
    ).style.display =
        "block";


    document.getElementById(
        "studentResultName"
    ).innerHTML = `
        الطالب:
        <strong>
            ${escapeHTML(studentName)}
        </strong>
    `;


    document.getElementById(
        "finalScore"
    ).innerText =
        `${score} / ${total}`;


    document.getElementById(
        "finalPercent"
    ).innerText =
        `${percent}%`;


    document.getElementById(
        "correctCount"
    ).innerText =
        score;


    document.getElementById(
        "wrongCount"
    ).innerText =
        wrong;


    document.getElementById(
        "timeoutCount"
    ).innerText =
        timeoutCount;


    document.getElementById(
        "durationBox"
    ).innerText =
        `⏱️ الوقت المستغرق: ${durationText}`;


    document.getElementById(
        "focusBox"
    ).innerText =
        `⚠️ مغادرة صفحة الاختبار: ${focusLosses}`;


    document.getElementById(
        "resultEvaluation"
    ).innerText =
        evaluation;


    await sendResult({

        name:
            studentName,

        score:
            score,

        total:
            total,

        percent:
            percent,

        correct:
            score,

        wrong:
            wrong,

        unanswered:
            unanswered,

        timeout:
            timeoutCount,

        durationSeconds:
            durationSeconds,

        duration:
            durationText,

        submittedAt:
            getArabicTime(),

        testType:
            "Final Quiz",

        subject:
            "General Pathology",

        focusLosses:
            focusLosses
    });
}


/* =========================================================
   EVALUATION
========================================================= */

function getEvaluation(percent) {

    if (percent >= 90) {
        return "🏆 ممتاز جدًا";
    }

    if (percent >= 80) {
        return "⭐ ممتاز";
    }

    if (percent >= 70) {
        return "👍 جيد جدًا";
    }

    if (percent >= 60) {
        return "📚 جيد";
    }

    return "🔄 يحتاج إلى مراجعة";
}


/* =========================================================
   FORMAT DURATION
========================================================= */

function formatDuration(seconds) {

    const minutes =
        Math.floor(
            seconds / 60
        );


    const remainingSeconds =
        seconds % 60;


    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(
            remainingSeconds
        ).padStart(2, "0")
    );
}


/* =========================================================
   ARABIC TIME
========================================================= */

function getArabicTime() {

    return new Date()
        .toLocaleTimeString(
            "ar-YE",
            {
                hour: "numeric",
                minute: "2-digit",
                second: "2-digit",
                hour12: true
            }
        );
}


/* =========================================================
   SEND RESULT
========================================================= */

async function sendResult(data) {

    try {

        await fetch(
            BACKEND_URL,
            {
                method: "POST",

                mode: "no-cors",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(data)
            }
        );

        console.log(
            "Result submitted successfully."
        );

    } catch (error) {

        console.error(
            "Result submission error:",
            error
        );
    }
}

   RESTART
========================================================= */

function restartExam() {

    const confirmed =
        confirm(
            "هل تريد بدء اختبار جديد؟"
        );


    if (!confirmed) {
        return;
    }


    clearQuestionTimer();


    localStorage.removeItem(
        "pathologyQuizProgress"
    );


    location.reload();
}


/* =========================================================
   SAVE PROGRESS
========================================================= */

function saveProgress() {

    if (examFinished) {
        return;
    }


    if (
        examQuestions.length === 0
    ) {
        return;
    }


    const data = {

        studentName:
            studentName,

        currentQuestion:
            currentQuestion,

        userAnswers:
            userAnswers,

        timeoutQuestions:
            timeoutQuestions,

        examQuestions:
            examQuestions,

        examStartTime:
            examStartTime,

        focusLosses:
            focusLosses
    };


    try {

        localStorage.setItem(
            "pathologyQuizProgress",
            JSON.stringify(data)
        );

    } catch (error) {

        console.error(
            "Could not save progress:",
            error
        );
    }
}


/* =========================================================
   RESUME SAVED EXAM
========================================================= */

function loadSavedProgress() {

    try {

        const saved =
            localStorage.getItem(
                "pathologyQuizProgress"
            );


        if (!saved) {
            return false;
        }


        const data =
            JSON.parse(saved);


        if (
            !data.studentName ||
            !data.examQuestions ||
            data.examQuestions.length === 0
        ) {

            return false;
        }


        const resume =
            confirm(
                `يوجد اختبار غير مكتمل للطالب:

${data.studentName}

هل تريد متابعة الاختبار؟`
            );


        if (!resume) {

            localStorage.removeItem(
                "pathologyQuizProgress"
            );

            return false;
        }


        studentName =
            data.studentName;


        currentQuestion =
            data.currentQuestion || 0;


        userAnswers =
            data.userAnswers || {};


        timeoutQuestions =
            data.timeoutQuestions || {};


        examQuestions =
            data.examQuestions;


        examStartTime =
            data.examStartTime ||
            Date.now();


        focusLosses =
            data.focusLosses || 0;


        examFinished = false;


        document.getElementById(
            "studentName"
        ).value =
            studentName;


        document.getElementById(
            "startScreen"
        ).style.display =
            "none";


        document.getElementById(
            "examScreen"
        ).style.display =
            "block";


        renderQuestion();


        return true;

    } catch (error) {

        console.error(
            "Resume error:",
            error
        );

        localStorage.removeItem(
            "pathologyQuizProgress"
        );

        return false;
    }
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;
}

/* =========================================================
   LONG PRESS
========================================================= */

document.addEventListener(
    "touchstart",
    function(event) {

        const examVisible =
            document.getElementById(
                "examScreen"
            ).style.display !== "none";


        if (!examVisible) {
            return;
        }


        const target =
            event.target;


        if (
            target.closest(".question-text") ||
            target.closest(".option") ||
            target.closest(".translation-box")
        ) {

            event.preventDefault();
        }

    },
    {
        passive: false
    }
);


/* =========================================================
   KEYBOARD PROTECTION
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        const examVisible =
            document.getElementById(
                "examScreen"
            ).style.display !== "none";


        if (!examVisible) {
            return;
        }


        const key =
            event.key.toLowerCase();


        /*
           منع:
           Ctrl+C
           Ctrl+X
           Ctrl+U
           Ctrl+S
           Ctrl+P
        */

        if (
            (
                event.ctrlKey ||
                event.metaKey
            ) &&
            [
                "c",
                "x",
                "u",
                "s",
                "p"
            ].includes(key)
        ) {

            event.preventDefault();

            return;
        }


        /*
           منع F12
        */

        if (
            key === "f12"
        ) {

            event.preventDefault();

            return;
        }
    }
);


/* =========================================================
   VISIBILITY / FOCUS LOSS
========================================================= */

document.addEventListener(
    "visibilitychange",
    function() {

        const examVisible =
            document.getElementById(
                "examScreen"
            ).style.display !== "none";


        if (
            examVisible &&
            document.visibilityState === "hidden" &&
            !examFinished
        ) {

            focusLosses++;

            saveProgress();
        }


        const privacyMask =
            document.getElementById(
                "privacyMask"
            );


        if (
            document.visibilityState === "hidden"
        ) {

            privacyMask.style.display =
                "flex";

        } else {

            privacyMask.style.display =
                "none";
        }
    }
);


/* =========================================================
   BEFORE EXIT
========================================================= */

window.addEventListener(
    "beforeunload",
    function(event) {

        const examVisible =
            document.getElementById(
                "examScreen"
            ).style.display !== "none";


        if (
            examVisible &&
            !examFinished
        ) {

            saveProgress();

            event.preventDefault();

            event.returnValue = "";
        }
    }
);


/* =========================================================
   BUTTON EVENTS
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        /*
           تحديث عدد الأسئلة تلقائيًا
        */

        document.getElementById(
            "totalQuestionsInfo"
        ).innerText =
            quizData.length;


        /*
           زر بدء الاختبار
        */

        document.getElementById(
            "startButton"
        ).addEventListener(
            "click",
            startExam
        );


        /*
           زر الترجمة
        */

        document.getElementById(
            "translationBtn"
        ).addEventListener(
            "click",
            toggleTranslation
        );


        /*
           زر إعادة الاختبار
        */

        document.getElementById(
            "restartButton"
        ).addEventListener(
            "click",
            restartExam
        );


        /*
           محاولة استعادة الاختبار
        */

        loadSavedProgress();
    }
);
