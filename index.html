<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>General Pathology Exam</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: #f1f5f9;
  color: #0f172a;
}

.container {
  width: 100%;
  max-width: 760px;
  margin: 20px auto;
  background: #ffffff;
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
}

.header {
  text-align: center;
  margin-bottom: 25px;
}

.header h1 {
  margin: 0;
  color: #1e3a8a;
  font-size: 24px;
}

.header p {
  margin: 8px 0 0;
  color: #64748b;
  font-size: 14px;
}

/* Start Screen */

#startScreen {
  display: block;
}

.input-group {
  margin: 25px 0;
}

.input-group label {
  display: block;
  font-weight: 700;
  margin-bottom: 8px;
  color: #334155;
}

.input-group input {
  width: 100%;
  padding: 14px;
  border: 1.5px solid #cbd5e1;
  border-radius: 10px;
  font-size: 16px;
  outline: none;
}

.input-group input:focus {
  border-color: #2563eb;
}

.exam-info {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}

.info-box {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 13px 8px;
  text-align: center;
}

.info-box strong {
  display: block;
  font-size: 18px;
  color: #1e3a8a;
}

.info-box span {
  font-size: 12px;
  color: #64748b;
}

.primary-btn,
.secondary-btn,
.danger-btn {
  width: 100%;
  border: none;
  border-radius: 11px;
  padding: 14px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.2s;
}

.primary-btn {
  background: #2563eb;
  color: white;
}

.primary-btn:hover {
  background: #1d4ed8;
}

.secondary-btn {
  background: #e2e8f0;
  color: #0f172a;
}

.danger-btn {
  background: #dc2626;
  color: white;
}

/* Exam */

#examScreen {
  display: none;
}

.exam-top {
  position: sticky;
  top: 0;
  z-index: 10;
  background: #ffffff;
  padding-bottom: 15px;
}

.top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.progress-text {
  font-weight: 700;
  color: #334155;
}

.timer {
  background: #eff6ff;
  color: #1d4ed8;
  border-radius: 10px;
  padding: 9px 13px;
  font-weight: 800;
  direction: ltr;
  min-width: 85px;
  text-align: center;
}

.timer.warning {
  background: #fef3c7;
  color: #b45309;
}

.timer.danger {
  background: #fee2e2;
  color: #b91c1c;
}

.progress-container {
  width: 100%;
  height: 9px;
  background: #e2e8f0;
  border-radius: 20px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #2563eb;
  transition: width 0.3s ease;
}

/* Question */

.question-card {
  margin-top: 20px;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 15px;
  padding: 20px;
}

.question-number {
  color: #2563eb;
  font-weight: 800;
  font-size: 14px;
  margin-bottom: 12px;
}

.question-text {
  direction: ltr;
  text-align: left;
  font-size: 18px;
  font-weight: 700;
  line-height: 1.6;
  color: #0f172a;
  margin-bottom: 20px;
}

.options {
  direction: ltr;
}

.option {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  background: #ffffff;
  border: 1.5px solid #cbd5e1;
  border-radius: 11px;
  padding: 14px;
  margin-bottom: 11px;
  cursor: pointer;
  text-align: left;
  font-size: 15px;
  line-height: 1.5;
  transition: 0.2s;
}

.option:hover {
  border-color: #2563eb;
  background: #eff6ff;
}

.option.selected {
  border-color: #2563eb;
  background: #dbeafe;
}

.option-letter {
  flex-shrink: 0;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: #e2e8f0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  color: #334155;
}

.option.selected .option-letter {
  background: #2563eb;
  color: white;
}

/* Navigation */

.navigation {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 18px;
}

.navigation button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.submit-area {
  margin-top: 15px;
}

.question-status {
  text-align: center;
  color: #64748b;
  font-size: 13px;
  margin-top: 12px;
}

/* Result */

#resultScreen {
  display: none;
  text-align: center;
}

.result-icon {
  font-size: 55px;
  margin-bottom: 10px;
}

.result-title {
  color: #065f46;
  font-size: 24px;
  font-weight: 800;
}

.score-circle {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  margin: 25px auto;
  background: #ecfdf5;
  border: 8px solid #10b981;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.score-number {
  font-size: 30px;
  font-weight: 900;
  color: #065f46;
}

.score-percent {
  font-size: 14px;
  color: #047857;
}

.result-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 20px 0;
}

.result-item {
  padding: 15px 8px;
  border-radius: 12px;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
}

.result-item strong {
  display: block;
  font-size: 21px;
}

.result-item span {
  font-size: 12px;
  color: #64748b;
}

/* Review */

#reviewScreen {
  display: none;
}

.review-title {
  text-align: center;
  color: #1e3a8a;
  margin-bottom: 20px;
}

.review-card {
  direction: ltr;
  text-align: left;
  border: 1px solid #e2e8f0;
  border-radius: 13px;
  padding: 16px;
  margin-bottom: 12px;
  background: #f8fafc;
}

.review-question {
  font-weight: 700;
  line-height: 1.5;
  margin-bottom: 10px;
}

.review-answer {
  padding: 9px;
  border-radius: 8px;
  margin-top: 7px;
  font-size: 14px;
}

.review-correct {
  background: #dcfce7;
  color: #166534;
}

.review-wrong {
  background: #fee2e2;
  color: #991b1b;
}

.review-unanswered {
  background: #fef3c7;
  color: #92400e;
}

.review-correct-answer {
  background: #dcfce7;
  color: #166534;
}

/* Mobile */

@media (max-width: 600px) {

  body {
    padding: 8px;
  }

  .container {
    margin: 5px auto;
    padding: 16px;
    border-radius: 14px;
  }

  .header h1 {
    font-size: 20px;
  }

  .exam-info {
    grid-template-columns: 1fr 1fr 1fr;
  }

  .question-card {
    padding: 15px;
  }

  .question-text {
    font-size: 16px;
  }

  .option {
    font-size: 14px;
    padding: 12px;
  }

  .top-row {
    align-items: stretch;
  }

  .timer {
    font-size: 14px;
  }

  .navigation {
    grid-template-columns: 1fr 1fr;
  }

  .result-grid {
    grid-template-columns: 1fr 1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">
    <h1>اختبار علم الأمراض العام</h1>
    <p>General Pathology | كلية طب الأسنان</p>
  </div>


  <!-- START SCREEN -->

  <section id="startScreen">

    <div class="exam-info">

      <div class="info-box">
        <strong>50</strong>
        <span>سؤال</span>
      </div>

      <div class="info-box">
        <strong>30</strong>
        <span>دقيقة</span>
      </div>

      <div class="info-box">
        <strong>100%</strong>
        <span>اختبار</span>

    <div class="input-group">

      <input
        type="text"
        id="studentName"

  <!-- EXAM SCREEN -->

      </div>

        <div class="progress-bar" id="progressBar"></div>
      </div>

    <div class="question-card">

    <div class="navigation">

  <!-- RESULT SCREEN -->

  <section id="resultScreen">

    <div class="result-icon">

    </div>

    <div class="result-title">
      تم إنهاء الاختبار
    </div>

    <p id="studentResultName"></p>

    <div class="score-circle">

      <div class="result-item">

    <button

      📋 مراجعة الإجابات
    </button>

    <br><br>

    <button
      class="secondary-btn"
      onclick="restartExam()"
    >
      🔄 إعادة الاختبار
    </button>

  </section>


  <!-- REVIEW SCREEN -->

  <section id="reviewScreen">

    <h2 class="review-title">
      📋 مراجعة الإجابات
    </h2>

    <div id="reviewContainer"></div>

    <button
      class="primary-btn"
      onclick="restartExam()"
    >
      🔄 إعادة الاختبار
    </button>

  </section>

</div>


<script>

/* =========================
   BACKEND
========================= */

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbzUQLJN40vyblri1MGbY6ZjvsOYUhGeC12HHl64X2sS8piWUmjx8fq1eH9tYgmUIg_Shw/exec";


/* =========================
   EXAM SETTINGS
========================= */

const EXAM_DURATION = 30 * 60;

let timeLeft = EXAM_DURATION;
let timerInterval = null;

let currentQuestion = 0;
let examQuestions = [];

let userAnswers = {};

let studentName = "";

let examFinished = false;


/* =========================
   QUESTIONS
========================= */

const quizData = [

{q:"1. The fundamental difference between simple atrophy and numerical atrophy is:",options:["Physiologic etiology vs pathologic etiology","Loss of cell size only vs loss of cell size and number via apoptosis","Reversible vs irreversible injury","Cytoplasmic swelling vs fragmentation"],answer:1},

{q:"2. Which cellular adaptation is characterized by an increase in the size of parenchymal cells resulting in organ enlargement?",options:["Hyperplasia","Metaplasia","Hypertrophy","Atrophy"],answer:2},

{q:"3. Left ventricular hypertrophy in systemic hypertension is classified as:",options:["Compensatory hypertrophy due to increased workload","Physiologic hyperplasia","Pathologic metaplasia","Disuse atrophy"],answer:0},

{q:"4. Hyperplasia can occur alongside hypertrophy in various tissues EXCEPT in:",options:["Uterine smooth muscle","Breast glandular tissue","Liver parenchyma","Cardiac and skeletal muscles"],answer:3},

{q:"5. Cigarette smoking classically induces which adaptive epithelial change in the bronchi?",options:["Glandular hyperplasia","Squamous metaplasia","Simple atrophy","Dysplastic hypertrophy"],answer:1},

{q:"6. The hallmark reversible changes visible on light microscopy following cellular injury are:",options:["Pyknosis and karyolysis","Caseous necrosis and calcification","Hydropic change and fatty change","Fibrinoid degeneration"],answer:2},

{q:"7. Which type of necrosis characteristically maintains the structural cellular architecture ('ghost cells')?",options:["Liquefactive necrosis","Coagulative necrosis","Caseous necrosis","Fat necrosis"],answer:1},

{q:"8. Ischemic necrosis occurring in the brain classically manifests as:",options:["Coagulative necrosis","Caseous necrosis","Fibrinoid necrosis","Liquefactive necrosis"],answer:3},

{q:"9. Langhans multinucleated giant cells characteristically feature nuclei arranged in:",options:["A peripheral horseshoe pattern","A random scatter throughout the cytoplasm","Two parallel linear rows","A single centrally clumped mass"],answer:0},

{q:"10. In contrast to foreign body giant cells, Langhans giant cells are typically diagnostic of:",options:["Silicosis","Tuberculosis","Asbestosis","Suture reactions"],answer:1},

{q:"11. The predominant leukocyte present during the initial 24 hours of acute inflammation is the:",options:["Macrophage","Lymphocyte","Neutrophil","Plasma cell"],answer:2},

{q:"12. Leukocyte rolling along endothelial surfaces is primarily mediated by:",options:["Selectins","Integrins","PECAM-1 (CD31)","Histamine"],answer:0},

{q:"13. Firm adhesion of leukocytes to endothelial cells requires binding mediated by:",options:["Selectins","Integrins (ICAM-1 interactions)","Prostaglandins","Bradykinin"],answer:1},

{q:"14. Which cytokine is recognized as the most potent activator of macrophages in chronic inflammation?",options:["Interleukin-1 (IL-1)","Tumor necrosis factor-alpha","Histamine","Interferon-gamma (IFN-γ)"],answer:3},

{q:"15. The elevated Erythrocyte Sedimentation Rate (ESR) seen in the acute-phase response is driven by increased hepatic synthesis of:",options:["Albumin","Fibrinogen","Transferrin","Superoxide dismutase"],answer:1},

{q:"16. Cells that continuously divide throughout life to replace lost cells (e.g., surface epithelia) are classified as:",options:["Labile cells","Stable cells","Permanent cells","Quiescent cells"],answer:0},

{q:"17. Cardiac myocytes and neurons are incapable of postnatal division and are classified as:",options:["Stable cells","Labile cells","Permanent cells","Stem cells"],answer:2},

{q:"18. Histologically, granulation tissue is composed of:",options:["Dense mature collagen with complete absence of vessels","Newly formed vessels (angiogenesis), fibroblasts, and inflammatory cells","Amorphous caseous debris","Purely squamous keratinized layers"],answer:1},

{q:"19. The cellular element responsible for wound contraction during tissue repair is the:",options:["Myofibroblast","Endothelial cell","Neutrophil","Keratinocyte"],answer:0},

{q:"20. A complication of wound healing characterized by excessive collagen accumulation protruding beyond original wound margins is:",options:["Hypertrophic scar","Contracture","Keloid","Ulcer"],answer:2},

{q:"21. Irreversible nuclear condensation characterized by shrinkage and increased basophilia is known as:",options:["Karyorrhexis","Pyknosis","Karyolysis","Autophagy"],answer:1},

{q:"22. The fragmentation of a pyknotic nucleus during cell death is defined as:",options:["Karyolysis","Apoptosis","Heterophagy","Karyorrhexis"],answer:3},

{q:"23. Enzymatic fat necrosis, classically observed in acute pancreatitis, results in chalky white deposits via:",options:["Caseation necrosis","Saponification with calcium","Lipofuscin deposition","Hyaline accumulation"],answer:1},

{q:"24. Fibrinoid necrosis is most commonly encountered in which of the following conditions?",options:["Myocardial infarction","Bacterial abscesses","Immune complex-mediated vasculitis","Tuberculous lymphadenitis"],answer:2},

{q:"25. Which pathway of apoptosis is initiated by the release of Cytochrome c from mitochondria?",options:["Intrinsic (mitochondrial) pathway","Extrinsic (death receptor) pathway","Perforin-granzyme pathway","Necroptotic pathway"],answer:0},

{q:"26. The extrinsic pathway of apoptosis is triggered via the activation of:",options:["Bcl-2 overexpression","Fas (CD95) and TNF receptor 1","Caspase-9 directly","C-reactive protein"],answer:1},

{q:"27. Which of the following is considered an anti-apoptotic protein?",options:["Bax","Bak","Bcl-2","Bid"],answer:2},

{q:"28. 'Brown atrophy' of the heart in aging or malnourished patients is caused by cytoplasmic accumulation of:",options:["Hemosiderin","Lipofuscin","Melanin","Glycogen"],answer:1},

{q:"29. Dystrophic calcification occurs under which of the following biochemical conditions?",options:["Elevated serum calcium levels in normal tissues","Systemic hyperparathyroidism","Normal serum calcium levels in necrotic or degenerating tissues","Hypervitaminosis D"],answer:2},

{q:"30. Metastatic calcification is primarily driven by:",options:["Systemic hypercalcemia","Localized tissue necrosis","Decreased serum phosphate","Atherosclerotic plaques only"],answer:0},

{q:"31. The primary chemical mediator responsible for the immediate transient phase of vascular permeability in acute inflammation is:",options:["Leukotriene B4","Histamine","Transforming growth factor-beta","Platelet-derived growth factor"],answer:1},

{q:"32. The transmigration of leukocytes across the vascular basement membrane is termed:",options:["Chemotaxis","Margination","Opsonization","Diapedesis"],answer:3},

{q:"33. Which molecule acts as an opsonin to facilitate phagocytosis?",options:["C3b","C5a","Bradykinin","Serotonin"],answer:0},

{q:"34. The classic cardinal signs of acute inflammation (Rubor, Tumor, Calor, Dolor) were first described by:",options:["Virchow","Celsus","Hunter","Cohnheim"],answer:1},

{q:"35. The fifth clinical sign of acute inflammation, 'Functio laesa' (loss of function), was added by:",options:["John Hunter","Julius Cohnheim","Rudolf Virchow","Elie Metchnikoff"],answer:2},

{q:"36. A localized collection of purulent exudate (pus) within an organ or confined tissue space is termed:",options:["Abscess","Ulcer","Phlegmon","Seroma"],answer:0},

{q:"37. Granulomatous inflammation is a distinctive histologic pattern of:",options:["Acute suppurative inflammation","Chronic inflammation characterized by aggregated epithelioid macrophages","Serous inflammation seen in burns","Purely non-immune hypersensitivity"],answer:1},

{q:"38. Non-caseating granulomas are characteristically identified in which systemic granulomatous disorder?",options:["Tuberculosis","Histoplasmosis","Sarcoidosis","Coccidioidomycosis"],answer:2},

{q:"39. Which key growth factor is central to collagen synthesis, fibroblast migration, and terminating chronic inflammation?",options:["Histamine","TGF-beta","TNF-alpha","Interleukin-8"],answer:1},

{q:"40. Healing by primary intention differs from secondary intention because primary intention exhibits:",options:["Extensive tissue defects requiring abundant granulation tissue","Clean, closely approximated margins with minimal tissue loss and scar","Prominent wound contraction by myofibroblasts","Higher rates of ulceration and delayed re-epithelialization"],answer:1},

{q:"41. An essential dietary cofactor required for the post-translational hydroxylation of proline and lysine in collagen synthesis is:",options:["Vitamin C","Vitamin D","Vitamin A","Vitamin K"],answer:0},

{q:"42. Trace element essential for collagen cross-linking via lysyl oxidase is:",options:["Iron","Zinc","Copper","Magnesium"],answer:2},

{q:"43. Edema fluid with low protein content, low specific gravity (<1.012), and caused by altered hemodynamic forces is a:",options:["Exudate","Transudate","Purulent fluid","Fibrinous effusion"],answer:1},

{q:"44. An inflammatory edema fluid characterized by high protein content and cellular debris is termed:",options:["Transudate","Exudate","Lymph fluid","Interstitial filtrate"],answer:1},

{q:"45. The classic triad of Virchow contributing to pathologic intravascular thrombosis includes:",options:["Hypertension, hyperlipidemia, and diabetes","Infection, fever, and leukocytosis","Endothelial injury, stasis/turbulent flow, and hypercoagulability","Vasoconstriction, vasodilation, and vascular stasis"],answer:2},

{q:"46. Arterial thrombi most commonly originate at sites of:",options:["Endothelial injury and atherosclerosis","Venous valve pockets","Normal capillary beds","Arteriovenous shunts"],answer:0},

{q:"47. Lines of Zahn are characteristic microscopic/gross features that distinguish:",options:["Coagulative necrosis from liquefactive necrosis","Antemortem thrombi from postmortem clots","Transudate from exudate","Labile cells from stable cells"],answer:1},

{q:"48. The most common source of pulmonary thromboemboli is:",options:["Right ventricular mural thrombi","Upper extremity veins","Mesenteric veins","Deep venous thrombosis (DVT) of the lower extremities"],answer:3},

{q:"49. Red (hemorrhagic) infarcts typically occur in organs with:",options:["Dual or collateral blood supply (e.g., lungs and small intestine)","Single terminal end-arterial circulation (e.g., spleen, kidney)","No collateral vascular networks","Dense fibrotic capsule preventing perfusion"],answer:0},

{q:"50. White (anemic) infarcts characteristically occur in solid organs with end-arterial supplies, such as the:",options:["Lungs and liver","Small intestine and ovaries","Kidney and spleen","Brain and meninges"],answer:2}

];


/* =========================
   START EXAM
========================= */

function startExam() {

  const input = document.getElementById("studentName");

  studentName = input.value.trim();

  if (!studentName) {
    alert("يرجى كتابة اسم الطالب أولاً.");
    input.focus();
    return;
  }

  examQuestions = shuffleQuestions();

  currentQuestion = 0;
  userAnswers = {};

  timeLeft = EXAM_DURATION;
  examFinished = false;

  localStorage.removeItem("pathologyQuizProgress");

  document.getElementById("startScreen").style.display = "none";
  document.getElementById("examScreen").style.display = "block";

  startTimer();
  renderQuestion();

  saveProgress();
}


/* =========================
   RANDOMIZE QUESTIONS
========================= */

function shuffleQuestions() {

  const copied = quizData.map(item => {

    const optionsWithAnswers = item.options.map((text, index) => ({
      text: text,
      originalIndex: index
    }));

    const shuffledOptions = shuffleArray(optionsWithAnswers);

    return {
      q: item.q,
      options: shuffledOptions.map(option => option.text),
      answer: shuffledOptions.findIndex(
        option => option.originalIndex === item.answer
      )
    };

  });

  return shuffleArray(copied);
}


function shuffleArray(array) {

  const arr = [...array];

  for (let i = arr.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [arr[i], arr[j]] = [arr[j], arr[i]];
  }

  return arr;
}


/* =========================
   RENDER QUESTION
========================= */

function renderQuestion() {

  const question = examQuestions[currentQuestion];

  if (!question) return;

  const total = examQuestions.length;

  document.getElementById("questionNumber").innerText =
    `السؤال ${currentQuestion + 1}`;

  document.getElementById("progressText").innerText =
    `السؤال ${currentQuestion + 1} من ${total}`;

  document.getElementById("questionText").innerText =
    question.q;

  const progress =
    ((currentQuestion + 1) / total) * 100;

  document.getElementById("progressBar").style.width =
    progress + "%";

  const optionsContainer =
    document.getElementById("optionsContainer");

  optionsContainer.innerHTML = "";

  const letters = ["A", "B", "C", "D"];

  question.options.forEach((option, index) => {

    const button = document.createElement("div");

    button.className = "option";

    if (userAnswers[currentQuestion] === index) {
      button.classList.add("selected");
    }

    button.innerHTML = `
      <span class="option-letter">${letters[index]}</span>
      <span>${escapeHTML(option)}</span>
    `;

    button.onclick = () => selectAnswer(index);

    optionsContainer.appendChild(button);

  });


  document.getElementById("prevBtn").disabled =
    currentQuestion === 0;


  if (currentQuestion === total - 1) {

    document.getElementById("nextBtn").innerText =
      "إنهاء الاختبار ✓";

  } else {

    document.getElementById("nextBtn").innerText =
      "التالي →";
  }


  if (userAnswers[currentQuestion] !== undefined) {

    document.getElementById("questionStatus").innerText =
      "تم اختيار إجابة لهذا السؤال ✓";

  } else {

    document.getElementById("questionStatus").innerText =
      "اختر إجابة واحدة";
  }


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =========================
   SELECT ANSWER
========================= */

function selectAnswer(index) {

  if (examFinished) return;

  userAnswers[currentQuestion] = index;

  renderQuestion();

  saveProgress();
}


/* =========================
   NEXT
========================= */

function nextQuestion() {

  if (currentQuestion === examQuestions.length - 1) {

    manualSubmit();

    return;
  }

  currentQuestion++;

  renderQuestion();

  saveProgress();
}


/* =========================
   PREVIOUS
========================= */

function previousQuestion() {

  if (currentQuestion <= 0) return;

  currentQuestion--;

  renderQuestion();

  saveProgress();
}


/* =========================
   TIMER
========================= */

function startTimer() {

  clearInterval(timerInterval);

  updateTimerDisplay();

  timerInterval = setInterval(() => {

    timeLeft--;

    updateTimerDisplay();

    saveProgress();

    if (timeLeft <= 0) {

      clearInterval(timerInterval);

      alert(
        "انتهى وقت الاختبار وسيتم تسليم إجاباتك تلقائيًا."
      );

      finishExam(true);
    }

  }, 1000);
}


function updateTimerDisplay() {

  const timer = document.getElementById("timer");

  const minutes =
    Math.floor(timeLeft / 60);

  const seconds =
    timeLeft % 60;

  timer.innerText =
    `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;


  timer.classList.remove(
    "warning",
    "danger"
  );


  if (timeLeft <= 300 && timeLeft > 60) {

    timer.classList.add("warning");

  } else if (timeLeft <= 60) {

    timer.classList.add("danger");
  }
}


/* =========================
   MANUAL SUBMIT
========================= */

function manualSubmit() {

  const answered =
    Object.keys(userAnswers).length;

  const unanswered =
    examQuestions.length - answered;

  let message =
    `تمت الإجابة على ${answered} من أصل ${examQuestions.length} سؤالًا.`;

  if (unanswered > 0) {

    message +=
      `\nيوجد ${unanswered} سؤال بدون إجابة.`;
  }

  message +=
    "\n\nهل تريد إنهاء الاختبار وتسليم النتيجة؟";

  if (confirm(message)) {

    finishExam(false);
  }
}


/* =========================
   FINISH EXAM
========================= */

async function finishExam(autoSubmit = false) {

  if (examFinished) return;

  examFinished = true;

  clearInterval(timerInterval);

  let score = 0;
  let answered = 0;

  examQuestions.forEach((question, index) => {

    if (userAnswers[index] !== undefined) {

      answered++;

      if (
        userAnswers[index] === question.answer
      ) {

        score++;
      }
    }

  });


  const total = examQuestions.length;

  const wrong =
    answered - score;

  const unanswered =
    total - answered;

  const percent =
    Math.round((score / total) * 100);


  localStorage.removeItem(
    "pathologyQuizProgress"
  );


  document.getElementById("examScreen").style.display =
    "none";

  document.getElementById("resultScreen").style.display =
    "block";


  document.getElementById("studentResultName").innerHTML =
    `الطالب: <strong>${escapeHTML(studentName)}</strong>`;


  document.getElementById("finalScore").innerText =
    `${score} / ${total}`;

  document.getElementById("finalPercent").innerText =
    `${percent}%`;

  document.getElementById("correctCount").innerText =
    score;

  document.getElementById("wrongCount").innerText =
    wrong;

  document.getElementById("unansweredCount").innerText =
    unanswered;


  await sendResult(
    studentName,
    score,
    total
  );

}


/* =========================
   SEND RESULT
========================= */

async function sendResult(
  name,
  score,
  total
) {

  try {

    await fetch(
      BACKEND_URL,
      {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          name: name,
          score: score,
          total: total
        })
      }
    );

    console.log(
      "Result submitted successfully."
    );

  } catch (error) {

    console.error(
      "Result submission error:",
      error
    );
  }
}


/* =========================
   REVIEW
========================= */

function showReview() {

  document.getElementById("resultScreen").style.display =
    "none";

  document.getElementById("reviewScreen").style.display =
    "block";

  const container =
    document.getElementById("reviewContainer");

  container.innerHTML = "";

  examQuestions.forEach((question, index) => {

    const card =
      document.createElement("div");

    card.className = "review-card";


    const selected =
      userAnswers[index];

    let statusHTML = "";


    if (selected === undefined) {

      statusHTML = `
        <div class="review-answer review-unanswered">
          ⚠️ بدون إجابة
        </div>
      `;

    } else if (selected === question.answer) {

      statusHTML = `
        <div class="review-answer review-correct">
          ✓ إجابة صحيحة
          <br>
          ${escapeHTML(question.options[selected])}
        </div>
      `;

    } else {

      statusHTML = `
        <div class="review-answer review-wrong">
          ✗ إجابة خاطئة
          <br>
          ${escapeHTML(question.options[selected])}
        </div>

        <div class="review-answer review-correct-answer">
          ✓ الإجابة الصحيحة
          <br>
          ${escapeHTML(question.options[question.answer])}
        </div>
      `;
    }


    card.innerHTML = `
      <div class="review-question">
        ${index + 1}. ${escapeHTML(question.q)}
      </div>

      ${statusHTML}
    `;


    container.appendChild(card);

  });


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =========================
   RESTART
========================= */

function restartExam() {

  if (
    !confirm(
      "هل تريد بدء اختبار جديد؟"
    )
  ) {
    return;
  }

  clearInterval(timerInterval);

  localStorage.removeItem(
    "pathologyQuizProgress"
  );

  location.reload();
}


/* =========================
   SAVE PROGRESS
========================= */

function saveProgress() {

  if (examFinished) return;

  const data = {

    studentName: studentName,

    currentQuestion: currentQuestion,

    userAnswers: userAnswers,

    examQuestions: examQuestions,

    timeLeft: timeLeft

  };


  try {

    localStorage.setItem(
      "pathologyQuizProgress",
      JSON.stringify(data)
    );

  } catch (error) {

    console.error(
      "Could not save progress",
      error
    );
  }
}


/* =========================
   RESUME EXAM
========================= */

function loadSavedProgress() {

  try {

    const saved =
      localStorage.getItem(
        "pathologyQuizProgress"
      );

    if (!saved) return false;

    const data =
      JSON.parse(saved);

    if (
      !data.studentName ||
      !data.examQuestions ||
      !data.timeLeft
    ) {
      return false;
    }


    const resume =
      confirm(
        `يوجد اختبار غير مكتمل للطالب ${data.studentName}.\n\nهل تريد متابعة الاختبار؟`
      );


    if (!resume) {

      localStorage.removeItem(
        "pathologyQuizProgress"
      );

      return false;
    }


    studentName =
      data.studentName;

    currentQuestion =
      data.currentQuestion || 0;

    userAnswers =
      data.userAnswers || {};

    examQuestions =
      data.examQuestions;

    timeLeft =
      data.timeLeft;

    document.getElementById("studentName").value =
      studentName;

    document.getElementById("startScreen").style.display =
      "none";

    document.getElementById("examScreen").style.display =
      "block";

    startTimer();

    renderQuestion();

    return true;

  } catch (error) {

    console.error(
      "Resume error:",
      error
    );

    return false;
  }
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;
}


/* =========================
   PAGE LOAD
========================= */

window.addEventListener(
  "DOMContentLoaded",
  () => {

    loadSavedProgress();

  }
);


/* =========================
   PREVENT ACCIDENTAL EXIT
========================= */

window.addEventListener(
  "beforeunload",
  function(event) {

    if (
      !examFinished &&
      examQuestions.length > 0 &&
      document.getElementById("examScreen").style.display !== "none"
    ) {

      event.preventDefault();

      event.returnValue = "";
    }

  }
);

</script>
