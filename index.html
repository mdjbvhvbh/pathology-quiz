  function shuffleArray(array) {  
  
    for (let i = array.length - 1; i > 0; i--) {  
  
      const j = Math.floor(Math.random() * (i + 1));  
  
      [array[i], array[j]] = [array[j], array[i]];  
  
    }  
  
    return array;  
  }  
  
  
  /*  
   * =====================================================  
   * خلط خيارات الأسئلة  
   *  
   * يتم حفظ الإجابة الصحيحة قبل الخلط،  
   * ثم تحديد موقعها الجديد بعد الخلط.  
   * =====================================================  
   */  
  
  quizData.forEach(item => {  
  
    const optionsWithStatus = item.options.map(  
      (option, index) => ({  
        text: option,  
        correct: index === item.answer  
      })  
    );  
  
    shuffleArray(optionsWithStatus);  
  
    item.options = optionsWithStatus.map(  
      option => option.text  
    );  
  
    item.answer = optionsWithStatus.findIndex(  
      option => option.correct  
    );  
  
  });

    }  
  
    /*  
     * إذا كانت الإجابة خاطئة  
     */  
  
    else {  
  
      selectedLabel.classList.add("wrong");  
  
      correctLabel.classList.add("correct");  
  
      feedback.style.color = "#b91c1c";  
  
      feedback.innerHTML =  
        "✗ إجابة غير صحيحة! الإجابة الصحيحة محددة بالأخضر.";  
  
    }  
  
  }  
  
  
  /*  
   * =====================================================  
   * إرسال الاختبار  
   * =====================================================  
   */  
  
  async function submitExam() {  
  
    const nameInput =  
      document.getElementById("studentName");  
  
  
    const name =  
      nameInput.value.trim();  
  
  
    if (!name) {  
  
      alert(  
        "يرجى كتابة اسمك أولاً في الخانة المخصصة بالأعلى!"  
      );  
  
      nameInput.focus();  
  
      return;  
    }  
  
  
    const answeredCount =  
      Object.keys(userAnswers).length;  
  
  
    if (answeredCount < quizData.length) {  
  
      const confirmSubmit =  
        confirm(  
          `لقد أجبت على ${answeredCount} من أصل 50 سؤالاً فقط. هل تريد التسليم فعلاً؟`  
        );  
  
  
      if (!confirmSubmit) {  
        return;  
      }  
  
    }  
  
  
    /*  
     * حساب الدرجة  
     */  
  
    let score = 0;  
  
  
    quizData.forEach((item, idx) => {  
  
      if (  
        userAnswers[idx] === item.answer  
      ) {  
  
        score++;  
  
      }  
  
    });  
  
  
    /*  
     * تعطيل زر الإرسال  
     */  
  
    const submitBtn =  
      document.getElementById("submitBtn");  
  
  
    submitBtn.disabled = true;  
  
    submitBtn.innerText =  
      "جارٍ إرسال النتيجة والتسليم...";  
  
  
    /*  
     * تجهيز رسالة Telegram  
     */  
  
    const text =  
      `🔔 تسليم اختبار باثولوجي (50 سؤال)!  
  
👤 اسم الطالب: ${name}  
  
📊 النتيجة: ${score} من ${quizData.length}  
  
📈 النسبة: ${((score / quizData.length) * 100).toFixed(1)}%  
  
⏰ الوقت: ${new Date().toLocaleTimeString("ar-YE")}`;  
  
  
    /*  
     * إرسال النتيجة  
     */  
  
    if (  
      BOT_TOKEN &&  
      !BOT_TOKEN.includes("ضع_التوكن")  
    ) {  
  
      const telegramUrl =  
        `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage` +  
        `?chat_id=${CHAT_ID}` +  
        `&text=${encodeURIComponent(text)}`;  
  
  
      try {  
  
        await fetch(telegramUrl);  
  
      }  
  
      catch (err) {  
  
        console.error(  
          "Telegram Error:",  
          err  
        );  
  
      }  
  
    }  
  
  
    /*  
     * إظهار النتيجة للطالب  
     */  
  
    document.getElementById(  
      "quizForm"  
    ).style.display = "none";  
  
  
    const resBox =  
      document.getElementById("resultBox");  
  
  
    resBox.style.display = "block";  
  
  
    resBox.innerHTML = `  
  
      تم تسليم إجابتك بنجاح يا  
      <b>${name}</b>.  
  
      <br><br>  
  
      درجتك النهائية:  
      <b>${score} من ${quizData.length}</b>  
  
      <br><br>  
  
      النسبة:  
      <b>${((score / quizData.length) * 100).toFixed(1)}%</b>  
  
    `;  
  
  }  
  
</script>  </body>
